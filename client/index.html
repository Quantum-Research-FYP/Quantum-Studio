<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var s = localStorage.getItem('theme');
        var t = s === 'light' || s === 'dark' ? s : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Experiment Studio</title>
    <meta name="description" content="An interactive platform for building, simulating, and visualizing quantum circuits." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quantumstudio.space/" />
    <meta property="og:title" content="Quantum Experiment Studio" />
    <meta property="og:description" content="An interactive platform for building, simulating, and visualizing quantum circuits." />
    <meta property="og:image" content="https://quantumstudio.space/images/SEO-image.jpeg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:url" content="https://quantumstudio.space/" />
    <meta property="twitter:title" content="Quantum Experiment Studio" />
    <meta property="twitter:description" content="An interactive platform for building, simulating, and visualizing quantum circuits." />
    <meta property="twitter:image" content="https://quantumstudio.space/images/SEO-image.jpeg" />

    <!-- Structured Data for Google Sitelinks & Rich Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Quantum Experiment Studio",
        "url": "https://quantumstudio.space/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://quantumstudio.space/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Quantum Experiment Studio",
        "description": "An interactive platform for building, simulating, and visualizing quantum circuits.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All"
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
